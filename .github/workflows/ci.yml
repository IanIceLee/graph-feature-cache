name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./framework -e ./core -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Synthetic demo
        run: python core/examples/synthetic_demo.py
